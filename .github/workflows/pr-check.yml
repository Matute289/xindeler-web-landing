name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Guards the netPrehash golden vector. If it drifts from the Rust
      # implementation every login breaks at once, and the server reports it as
      # invalid credentials, which is indistinguishable from a wrong password.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
